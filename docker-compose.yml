services:
  neuralbank-api:
    build: .
    command: uvicorn src.app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file: .env.neuralbank

  neuralbank-document:
    build: .
    command: python src/tasks/event_producer.py
    env_file: .env.neuralbank

  neuralbank-image:
    build: .
    command: python src/tasks/image_event_handler.py
    env_file: .env.neuralbank

  neuralbank-save:
    build: .
    command: python src/tasks/extraction_event_handler.py
    env_file: .env.neuralbank