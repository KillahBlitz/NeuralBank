# .github/workflows/main.yml
name: Build & Deploy NeuralBank

on:
  push:
    branches: [main]

jobs:
  # ─────────────────────────────────────────
  # FASE 1 — Build de la imagen única
  # ─────────────────────────────────────────
  build:
    name: Build image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.vars.outputs.image }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Calcular nombre de imagen en minúsculas
        id: vars
        run: |
          echo "image=ghcr.io/killahblitz/neuralbank" >> $GITHUB_OUTPUT

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ steps.vars.outputs.image }}:latest
            ${{ steps.vars.outputs.image }}:${{ github.sha }}

  # ─────────────────────────────────────────
  # FASE 2 — Sincronizar .env.neuralbank al cluster
  # ─────────────────────────────────────────
  sync-env:
    name: Sync env to cluster
    needs: build
    runs-on: self-hosted

    steps:
      - name: Crear/actualizar Secret neuralbank-env
        run: |
          echo "${{ secrets.ENV_NEURALBANK }}" > .env.neuralbank
          kubectl create secret generic neuralbank-env \
            --from-env-file=.env.neuralbank \
            --dry-run=client -o yaml | kubectl apply -f -
          rm .env.neuralbank

  # ─────────────────────────────────────────
  # FASE 3 — Deploy de los 4 servicios en paralelo
  # ─────────────────────────────────────────
  deploy:
    name: Deploy ${{ matrix.service }}
    needs: [build, sync-env]
    runs-on: self-hosted

    strategy:
      matrix:
        service:
          - neuralbank-api
          - neuralbank-producer
          - neuralbank-image
          - neuralbank-extractor

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Actualizar tag de imagen en manifest
        run: |
          sed -i "s|image:.*neuralbank:.*|image: ${{ needs.build.outputs.image }}:${{ github.sha }}|" \
            kubernetes/${{ matrix.service }}/deployment.yaml

      - name: Apply manifest
        run: |
          kubectl apply -f kubernetes/${{ matrix.service }}/deployment.yaml

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/${{ matrix.service }} --timeout=120s
